<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1080" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="1080" rx="16" fill="#0F172A"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#F8FAFC" font-size="24" font-weight="800">PDF-to-SQL Pipeline Architecture</text>
  <text x="400" y="70" text-anchor="middle" fill="#94A3B8" font-size="13">Sovereign extraction — local-first OCR, minimal cloud, deterministic validation</text>

  <!-- Stats Bar -->
  <rect x="40" y="90" width="170" height="50" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <text x="125" y="112" text-anchor="middle" fill="#6366F1" font-size="20" font-weight="800">7</text>
  <text x="125" y="130" text-anchor="middle" fill="#94A3B8" font-size="10">Documents Tested</text>

  <rect x="225" y="90" width="170" height="50" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <text x="310" y="112" text-anchor="middle" fill="#0D9488" font-size="20" font-weight="800">95.4%</text>
  <text x="310" y="130" text-anchor="middle" fill="#94A3B8" font-size="10">Avg Confidence</text>

  <rect x="410" y="90" width="170" height="50" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <text x="495" y="112" text-anchor="middle" fill="#4285F4" font-size="20" font-weight="800">$0.0005</text>
  <text x="495" y="130" text-anchor="middle" fill="#94A3B8" font-size="10">Avg Cost / Doc</text>

  <rect x="595" y="90" width="170" height="50" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <text x="680" y="112" text-anchor="middle" fill="#D97706" font-size="20" font-weight="800">3</text>
  <text x="680" y="130" text-anchor="middle" fill="#94A3B8" font-size="10">Countries</text>

  <!-- INPUT BLOCK -->
  <rect x="60" y="165" width="680" height="80" rx="12" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.3)"/>
  <text x="90" y="190" fill="#818CF8" font-size="11" font-weight="700" letter-spacing="1.5">📄 INPUT</text>
  <text x="90" y="212" fill="#F1F5F9" font-size="17" font-weight="700">PDF Upload</text>
  <rect x="300" y="185" width="120" height="24" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="360" y="202" text-anchor="middle" fill="#CBD5E1" font-size="11">Bank Statements</text>
  <rect x="430" y="185" width="80" height="24" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="470" y="202" text-anchor="middle" fill="#CBD5E1" font-size="11">Invoices</text>
  <rect x="520" y="185" width="110" height="24" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="575" y="202" text-anchor="middle" fill="#CBD5E1" font-size="11">Clinical Notes</text>

  <!-- Arrow 1 -->
  <line x1="400" y1="245" x2="400" y2="275" stroke="#475569" stroke-width="2"/>
  <polygon points="395,275 405,275 400,285" fill="#475569"/>

  <!-- LAYER 1: SOVEREIGN OCR -->
  <rect x="60" y="290" width="680" height="115" rx="12" fill="rgba(13,148,136,0.08)" stroke="rgba(13,148,136,0.3)"/>
  <text x="90" y="318" fill="#0D9488" font-size="11" font-weight="700" letter-spacing="1.5">🔒 LAYER 1 — SOVEREIGN OCR</text>
  <text x="90" y="342" fill="#F1F5F9" font-size="17" font-weight="700">Docling (IBM, MIT License)</text>
  <text x="90" y="362" fill="#94A3B8" font-size="12">Runs locally on CPU. No GPU. No cloud. No data leaves machine.</text>
  <!-- Badges -->
  <rect x="570" y="305" width="60" height="22" rx="6" fill="rgba(13,148,136,0.2)"/>
  <text x="600" y="320" text-anchor="middle" fill="#0D9488" font-size="10" font-weight="700">LOCAL</text>
  <rect x="640" y="305" width="80" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="680" y="320" text-anchor="middle" fill="#CBD5E1" font-size="10" font-weight="600">$0.00</text>
  <!-- Feature tags -->
  <rect x="90" y="375" width="100" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="140" y="390" text-anchor="middle" fill="#CBD5E1" font-size="11">Text Extraction</text>
  <rect x="200" y="375" width="100" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="250" y="390" text-anchor="middle" fill="#CBD5E1" font-size="11">Table Detection</text>
  <rect x="310" y="375" width="100" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="360" y="390" text-anchor="middle" fill="#CBD5E1" font-size="11">Layout Parsing</text>
  <rect x="420" y="375" width="110" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="475" y="390" text-anchor="middle" fill="#CBD5E1" font-size="11">97-99% Confidence</text>

  <!-- Arrow 2 -->
  <line x1="400" y1="405" x2="400" y2="435" stroke="#475569" stroke-width="2"/>
  <polygon points="395,435 405,435 400,445" fill="#475569"/>
  <text x="400" y="428" text-anchor="middle" fill="#64748B" font-size="10" font-style="italic">extracted text only ↓</text>

  <!-- LAYER 2: SCHEMA MAPPING -->
  <rect x="60" y="450" width="680" height="115" rx="12" fill="rgba(66,133,244,0.08)" stroke="rgba(66,133,244,0.3)"/>
  <text x="90" y="478" fill="#4285F4" font-size="11" font-weight="700" letter-spacing="1.5">🧠 LAYER 2 — SCHEMA MAPPING</text>
  <text x="90" y="502" fill="#F1F5F9" font-size="17" font-weight="700">Gemini 2.5 Flash-Lite</text>
  <text x="90" y="522" fill="#94A3B8" font-size="12">Model never sees the original PDF. Only extracted text for JSON mapping.</text>
  <!-- Badges -->
  <rect x="530" y="465" width="110" height="22" rx="6" fill="rgba(66,133,244,0.2)"/>
  <text x="585" y="480" text-anchor="middle" fill="#4285F4" font-size="10" font-weight="700">MINIMAL CLOUD</text>
  <rect x="650" y="465" width="70" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="685" y="480" text-anchor="middle" fill="#CBD5E1" font-size="10" font-weight="600">$0.10/1M</text>
  <!-- Feature tags -->
  <rect x="90" y="535" width="110" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="145" y="550" text-anchor="middle" fill="#CBD5E1" font-size="11">Few-Shot Prompts</text>
  <rect x="210" y="535" width="110" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="265" y="550" text-anchor="middle" fill="#CBD5E1" font-size="11">Typed JSON Output</text>
  <rect x="330" y="535" width="120" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="390" y="550" text-anchor="middle" fill="#CBD5E1" font-size="11">Swappable Model</text>
  <rect x="460" y="535" width="120" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="520" y="550" text-anchor="middle" fill="#CBD5E1" font-size="11">Pydantic Validation</text>

  <!-- Arrow 3 -->
  <line x1="400" y1="565" x2="400" y2="595" stroke="#475569" stroke-width="2"/>
  <polygon points="395,595 405,595 400,605" fill="#475569"/>

  <!-- LAYER 3: TRUST ENGINE -->
  <rect x="60" y="610" width="680" height="115" rx="12" fill="rgba(217,119,6,0.08)" stroke="rgba(217,119,6,0.3)"/>
  <text x="90" y="638" fill="#D97706" font-size="11" font-weight="700" letter-spacing="1.5">✅ LAYER 3 — TRUST ENGINE</text>
  <text x="90" y="662" fill="#F1F5F9" font-size="17" font-weight="700">Deterministic Validation</text>
  <text x="90" y="682" fill="#94A3B8" font-size="12">No LLM involved. Pure business logic catches what AI misses.</text>
  <!-- Badges -->
  <rect x="540" y="625" width="110" height="22" rx="6" fill="rgba(217,119,6,0.2)"/>
  <text x="595" y="640" text-anchor="middle" fill="#D97706" font-size="10" font-weight="700">DETERMINISTIC</text>
  <rect x="660" y="625" width="60" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="690" y="640" text-anchor="middle" fill="#CBD5E1" font-size="10" font-weight="600">$0.00</text>
  <!-- Feature tags -->
  <rect x="90" y="695" width="140" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="160" y="710" text-anchor="middle" fill="#CBD5E1" font-size="11">Balance Reconciliation</text>
  <rect x="240" y="695" width="110" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="295" y="710" text-anchor="middle" fill="#CBD5E1" font-size="11">Totals Matching</text>
  <rect x="360" y="695" width="120" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="420" y="710" text-anchor="middle" fill="#CBD5E1" font-size="11">Date Format Checks</text>
  <rect x="490" y="695" width="130" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="555" y="710" text-anchor="middle" fill="#CBD5E1" font-size="11">Refund Adjustments</text>

  <!-- Arrow 4 -->
  <line x1="400" y1="725" x2="400" y2="755" stroke="#475569" stroke-width="2"/>
  <polygon points="395,755 405,755 400,765" fill="#475569"/>

  <!-- LAYER 4: SQL PERSISTENCE -->
  <rect x="60" y="770" width="680" height="115" rx="12" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.3)"/>
  <text x="90" y="798" fill="#A855F7" font-size="11" font-weight="700" letter-spacing="1.5">🗄️ LAYER 4 — SQL PERSISTENCE</text>
  <text x="90" y="822" fill="#F1F5F9" font-size="17" font-weight="700">SQLite (Local, Zero-Config)</text>
  <text x="90" y="842" fill="#94A3B8" font-size="12">Relational tables per document type. Queryable via API or plain SQL. Swappable for Postgres/BigQuery.</text>
  <!-- Badges -->
  <rect x="570" y="785" width="60" height="22" rx="6" fill="rgba(168,85,247,0.2)"/>
  <text x="600" y="800" text-anchor="middle" fill="#A855F7" font-size="10" font-weight="700">LOCAL</text>
  <rect x="640" y="785" width="80" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="680" y="800" text-anchor="middle" fill="#CBD5E1" font-size="10" font-weight="600">$0.00</text>
  <!-- Feature tags -->
  <rect x="90" y="855" width="110" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="145" y="870" text-anchor="middle" fill="#CBD5E1" font-size="11">extraction_jobs</text>
  <rect x="210" y="855" width="130" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="275" y="870" text-anchor="middle" fill="#CBD5E1" font-size="11">bank_transactions</text>
  <rect x="350" y="855" width="130" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="415" y="870" text-anchor="middle" fill="#CBD5E1" font-size="11">invoice_line_items</text>
  <rect x="490" y="855" width="110" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="545" y="870" text-anchor="middle" fill="#CBD5E1" font-size="11">clinical_notes</text>

  <!-- Arrow 5 -->
  <line x1="400" y1="885" x2="400" y2="915" stroke="#475569" stroke-width="2"/>
  <polygon points="395,915 405,915 400,925" fill="#475569"/>

  <!-- OUTPUT BLOCK -->
  <rect x="60" y="930" width="680" height="80" rx="12" fill="rgba(22,163,74,0.08)" stroke="rgba(22,163,74,0.3)"/>
  <text x="90" y="958" fill="#16A34A" font-size="11" font-weight="700" letter-spacing="1.5">📊 OUTPUT</text>
  <text x="90" y="982" fill="#F1F5F9" font-size="17" font-weight="700">SQL Database + JSON</text>
  <rect x="300" y="960" width="110" height="24" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="355" y="977" text-anchor="middle" fill="#CBD5E1" font-size="11">Queryable via API</text>
  <rect x="420" y="960" width="110" height="24" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="475" y="977" text-anchor="middle" fill="#CBD5E1" font-size="11">Validation Status</text>
  <rect x="540" y="960" width="100" height="24" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="590" y="977" text-anchor="middle" fill="#CBD5E1" font-size="11">Cost Tracking</text>

  <!-- Security Callout -->
  <rect x="60" y="1030" width="680" height="36" rx="8" fill="rgba(13,148,136,0.08)" stroke="rgba(13,148,136,0.2)"/>
  <text x="400" y="1053" text-anchor="middle" fill="#5EEAD4" font-size="12" font-weight="600">🔒 Original PDF never leaves your machine • LLM only sees extracted text • Layer 2 swappable for air-gapped deployment</text>

</svg>
